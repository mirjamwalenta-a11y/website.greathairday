<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Farbkompass · Great Hair Day</title>
<link rel="canonical" href="https://www.greathairday.at/farbkompass/">
<meta property="og:title" content="Farbkompass – finde deine stimmige Farbrichtung">
<meta property="og:description" content="Was soll deine Haarfarbe in deinem Gesicht bewirken? 3 kurze Fragen, eine klare Orientierung für deine Farbberatung.">
<meta property="og:image" content="https://www.greathairday.at/bilder/vorschau.jpg">
<meta name="description" content="Was soll deine Haarfarbe in deinem Gesicht bewirken? 3 kurze Fragen, eine klare Orientierung für deine Farbberatung.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23F5F0E8'/%3E%3Ctext x='32' y='46' font-family='Georgia,serif' font-size='44' font-weight='700' text-anchor='middle' fill='%23816a3c'%3EG%3C/text%3E%3C/svg%3E">
<style>
/* Schriften lokal wie auf greathairday.at (keine Verbindung zu Google) */
@font-face{font-family:"Playfair Display";font-style:normal;font-weight:400 900;font-display:swap;src:url(../fonts/playfair.woff2) format("woff2")}
@font-face{font-family:"Playfair Display";font-style:italic;font-weight:400 900;font-display:swap;src:url(../fonts/playfair-italic.woff2) format("woff2")}
@font-face{font-family:"Inter";font-style:normal;font-weight:300 600;font-display:swap;src:url(../fonts/inter.woff2) format("woff2")}
/* Farben und Grundformen wie der HaarKompass */
:root{
  --bg:#F5F0E8; --surface:#FDFAF5; --surface-2:#EDE6DA; --ink:#1A1A18; --muted:#66604F; --line:#E2D9CA;
  --accent:#7A6337; --accent-ink:#FFFFFF; --accent-soft:#EFE6D3;
  --shadow:0 1px 2px rgba(42,33,28,.06),0 6px 20px rgba(42,33,28,.07);
  --f-display:"Playfair Display",Georgia,serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#17120F; --surface:#221B17; --surface-2:#2D241F; --ink:#F2EAE4; --muted:#B3A499; --line:#3D322B;
    --accent:#D2BC8E; --accent-ink:#1A1A18; --accent-soft:#3A3122;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#17120F; --surface:#221B17; --surface-2:#2D241F; --ink:#F2EAE4; --muted:#B3A499; --line:#3D322B;
  --accent:#D2BC8E; --accent-ink:#1A1A18; --accent-soft:#3A3122;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55}
button{font:inherit;color:inherit}
b,strong{font-weight:600}
h1,h2{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(1.9rem,6vw,2.6rem);font-weight:700;letter-spacing:-.005em}
p{margin:0}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
[tabindex="-1"]:focus{outline:none}
[hidden]{display:none!important}

.wrap{max-width:760px;margin:0 auto;padding-inline:16px}
header.top{border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:60px}
.brand{display:flex;align-items:baseline;gap:10px;background:none;border:0;padding:0;cursor:pointer;min-width:0}
.logo{font-family:var(--f-display);font-size:1.2rem;font-weight:700;letter-spacing:.02em;color:var(--ink);white-space:nowrap}
.logo span{color:var(--accent)}
.brand small{font-family:var(--f-body);font-weight:500;font-size:.8rem;color:var(--muted);white-space:nowrap;border-left:1px solid var(--line);padding-left:10px}

main{padding-block:28px 56px}
.view{display:flex;flex-direction:column;gap:24px;animation:rein .3s ease both}
@keyframes rein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){ .view{animation:none} .progress .bar i{transition:none} .opt{transition:none} }
.eyebrow{text-transform:uppercase;letter-spacing:.09em;font-size:.75rem;font-weight:600;color:var(--muted)}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 20px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center;min-height:48px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.ghost{background:none;border-color:transparent;color:var(--accent);padding-inline:10px}
.btn svg{width:18px;height:18px}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* Fragen */
.progress{display:flex;align-items:center;gap:12px}
.progress .bar{flex:1;height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.progress .bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s ease}
.progress span{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.88rem;font-weight:600;white-space:nowrap}
.q-head{display:flex;flex-direction:column;gap:6px}
.options{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 16px;cursor:pointer;min-height:64px;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--accent)}
.opt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt .mark{flex:none;width:22px;height:22px;border:2px solid var(--line);border-radius:50%;margin-top:1px;display:grid;place-items:center}
.opt[aria-checked="true"] .mark{border-color:var(--accent);background:var(--accent)}
.opt[aria-checked="true"] .mark::after{content:"";width:6px;height:11px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.opt b{display:block;line-height:1.3}
.opt small{display:block;color:var(--muted);font-size:.86rem;line-height:1.4;margin-top:2px}
.q-nav{display:flex;justify-content:space-between;gap:10px;align-items:center}

/* Ergebnis */
.result-head{display:flex;flex-direction:column;gap:10px}
.r-name{font-style:italic;color:var(--accent)}
.r-wirkung{font-size:1.12rem}
.r-block{display:flex;flex-direction:column;gap:8px}
.r-block + .r-block{border-top:1px solid var(--line);padding-top:16px;margin-top:16px}
.abschluss{border-left:6px solid var(--accent)}
.alt{display:flex;flex-direction:column;gap:6px;border-style:dashed;box-shadow:none;background:none}
.alt .alt-name{font-family:var(--f-display);font-style:italic;font-size:1.4rem;line-height:1.2}

/* Termin */
.book{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--ink);color:var(--bg);border-radius:16px;padding:20px}
.book h2{color:var(--bg);font-size:clamp(1.35rem,4vw,1.7rem)}
.book p{color:color-mix(in srgb,var(--bg) 78%,transparent);font-size:.95rem;margin-top:4px;max-width:46ch}
.book .btn{background:var(--bg);border-color:var(--bg);color:var(--ink)}
.book .btn:hover{filter:brightness(.95)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
footer.foot{border-top:1px solid var(--line);padding-block:20px 32px;font-size:.88rem;color:var(--muted)}
footer.foot .wrap{display:flex;gap:8px 18px;flex-wrap:wrap;align-items:baseline}
footer.foot .logo{font-size:1rem}
footer.foot a{color:var(--muted)}

@media (max-width:520px){
  .card{padding:16px}
  .options{grid-template-columns:1fr}
}
@media print{
  header.top,.actions,.no-print,footer.foot{display:none!important}
  .book{background:none;color:#000;border:1px solid #999}
  .book h2,.book p{color:#000}
  body{background:#fff;color:#000;font-size:12pt}
  .card{box-shadow:none;break-inside:avoid}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <button class="brand" id="home" aria-label="Great Hair Day Farbkompass – von vorne beginnen">
      <span class="logo">Great Hair<span>.</span>Day</span><small>Farbkompass</small>
    </button>
  </div>
</header>

<main class="wrap" id="buehne" aria-live="polite"></main>

<footer class="foot">
  <div class="wrap">
    <span class="logo">Great Hair<span>.</span>Day</span>
    <a href="../">greathairday.at</a>
    <a href="https://stylisten.eu/pranz#online-buchung" target="_blank" rel="noopener">Online Termin buchen<span class="sr-only"> (öffnet neues Fenster)</span></a>
    <a href="../haarkompass/">HaarKompass</a>
    <a href="../#impressum">Impressum</a>
    <a href="../datenschutz.html">Datenschutz</a>
  </div>
</footer>

<script src="/farbkompass/kern.js?v=202611091200"></script>
<script>
"use strict";
/* ─────────────────────────────────────────────────────────────
   Farbkompass – Kund:innen-Version auf greathairday.at
   Fragen, Punkte-Logik und Texte kommen aus kern.js (gemeinsamer Kern
   mit der Team-Version). Hier steht nur die Darstellung.
   Rein im Browser: es werden keine Antworten gespeichert oder gesendet.
   ───────────────────────────────────────────────────────────── */
const { RICHTUNGEN, FRAGEN, ABSCHLUSS, auswerten, warumText } = window.FARBKOMPASS;

const buehne = document.getElementById("buehne");
let antworten = [];

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let ersterAufruf = true;
function fokus(id){ if (ersterAufruf) { ersterAufruf = false; return; } const el = document.getElementById(id); if (el) el.focus({ preventScroll: true }); window.scrollTo({ top: 0 }); }

function zeigeFrage(n){
  const f = FRAGEN[n];
  buehne.innerHTML = `
    <section class="view">
      <div class="progress"><div class="bar"><i style="width:${(n + 1) / 3 * 100}%"></i></div><span>Schritt ${n + 1} von 3</span></div>
      <div class="q-head">
        <h1 id="q-title" tabindex="-1">${esc(f.titel)}</h1>
        <p class="muted">${esc(f.hinweis)}</p>
      </div>
      <div class="options" role="radiogroup" aria-labelledby="q-title">
        ${f.optionen.map((o, i) => `
          <button class="opt" role="radio" aria-checked="${antworten[n] === i}" data-i="${i}">
            <span class="mark" aria-hidden="true"></span>
            <span><b>${esc(o.t)}</b><small>${esc(o.s)}</small></span>
          </button>`).join("")}
      </div>
      ${n > 0 ? `<div class="q-nav"><button class="btn ghost" id="zurueck">← Zurück</button></div>` : ""}
    </section>`;
  buehne.querySelectorAll(".opt").forEach(btn => btn.addEventListener("click", () => {
    buehne.querySelectorAll(".opt").forEach(x => x.setAttribute("aria-checked", "false"));
    btn.setAttribute("aria-checked", "true");
    antworten[n] = Number(btn.dataset.i);
    antworten.length = n + 1;
    setTimeout(() => n < 2 ? zeigeFrage(n + 1) : zeigeErgebnis(), 260);
  }));
  const z = document.getElementById("zurueck");
  if (z) z.addEventListener("click", () => zeigeFrage(n - 1));
  fokus("q-title");
}

function zeigeErgebnis(){
  const { haupt, alternative } = auswerten(antworten);
  const r = RICHTUNGEN[haupt];
  buehne.innerHTML = `
    <section class="view">
      <div class="result-head">
        <div class="eyebrow">Deine stimmige Farbrichtung</div>
        <h1 class="r-name" id="r-title" tabindex="-1">${esc(r.name)}</h1>
        <p class="r-wirkung">${esc(r.wirkung)}</p>
      </div>

      <div class="card">
        <div class="r-block">
          <div class="eyebrow">Warum das zu dir passen könnte</div>
          <p>${esc(warumText(antworten))}</p>
        </div>
        <div class="r-block">
          <div class="eyebrow">Darauf achten wir im Salon</div>
          <p>${esc(r.salon)}</p>
        </div>
      </div>

      <div class="card abschluss"><p>${esc(ABSCHLUSS)}</p></div>

      ${alternative ? `
      <div class="card alt">
        <div class="eyebrow">Auch gut zu dir passen könnte:</div>
        <p class="alt-name">${esc(RICHTUNGEN[alternative.zu].name)}</p>
        <p class="muted">${esc(alternative.wann)}</p>
      </div>` : ""}

      <div class="book">
        <div><h2>Lass uns gemeinsam hinschauen</h2><p>Bring deine Farbrichtung zur Farbberatung mit. Wir schauen sie uns an deinem Haar und in deinem Gesicht an.</p></div>
        <a class="btn" href="https://stylisten.eu/pranz#online-buchung" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Termin buchen<span class="sr-only"> (öffnet neues Fenster)</span></a>
      </div>

      <div class="actions no-print">
        <button class="btn" id="neu">Noch einmal starten</button>
        <button class="btn ghost" id="zurueck">← Letzte Antwort ändern</button>
      </div>
    </section>`;
  document.getElementById("neu").addEventListener("click", neuStart);
  document.getElementById("zurueck").addEventListener("click", () => zeigeFrage(2));
  fokus("r-title");
}

function neuStart(){ antworten = []; zeigeFrage(0); }
document.getElementById("home").addEventListener("click", neuStart);

zeigeFrage(0);
</script>
</body>
</html>
